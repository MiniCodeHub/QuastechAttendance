<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QUASTECH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="dashboard" id="appBody">
<div class="dashboard-container">

    <!-- Header -->
    <div class="toggle-wrap">
        <label class="toggle-pill" aria-hidden="true">
            <input type="checkbox" id="themeToggle" />
            <div class="pill-track"></div>
            <div class="pill-knob" id="knob"></div>
        </label>
    </div>
    <div class="dashboard-header">
        <div class="header-left">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-small">
        </div>
        <div class="header-right">
            <div class="student-info" onclick="window.location.href='/profile';">
                <span class="student-name">👤 {{ student_name }}</span>
                <span class="student-reg">ID: {{ reg_number }}</span>
            </div>
            <a href="{{ url_for('attendance_page') }}" class="nav-btn">📋 Attendance</a>
        </div>
    </div>

    <!-- Stats Blocks – Order: Present Hours → Absent → Total Hours -->
    <div class="stats-blocks">
        <!-- 1st Block: Present Days -->
        <div class="stat-block present">
            <h3>Present Days</h3>
            <p id="presentDaysDisplay">{{ stats.present_days }}</p>
            <div class="mini-intervals" id="presentMiniBlocks"></div>
        </div>

        <!-- 2nd Block: Absent -->
        <div class="stat-block absent">
            <h3>Absent Days</h3>
            <p id="absentCount">{{ stats.absent }}</p>
            <div class="mini-intervals" id="absentMiniBlocks"></div>
        </div>

        <!-- 3rd Block: Total Days -->
        <div class="stat-block total">
            <h3>Total Days</h3>
            <p id="totalDaysDisplay">{{ stats.total_days }}</p>
        </div>
    </div>

    <!-- Calendar -->
    <div class="calendar-container" id="calendarContainer">
        <h3>📅 Monthly Attendance Calendar</h3>
        <div class="calendar-header">
            <button id="prevMonth" type="button">◀ Previous</button>
            <span id="calendarMonth">January 2025</span>
            <button id="nextMonth" type="button">Next ▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
