<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QUASTECH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="dashboard" id="appBody">
<div class="dashboard-container">
    <!-- Header -->
    <div class="dashboard-header">
        <div class="student-info">
            <span class="student-name">👤 {{ student_name }}</span>
            <span class="student-reg">ID: {{ reg_number }}</span>
        </div>
        <div class="header-right">
            <a href="{{ url_for('attendance_page') }}" class="nav-btn" style="text-decoration: none;">📋 Attendance</a>
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-small">
        </div>
    </div>

    <!-- Simple Settings Navbar -->
    <div class="settings-navbar">
        <div class="nav-links">
            <a href="/profile" class="nav-link">
                <span>👤</span> Profile
            </a>
            <a href="#" class="nav-link" onclick="toggleTheme(); return false;">
                <span>🎨</span> Theme
            </a>
            <a href="/logout" class="nav-link logout">
                <span>🚪</span> Logout
            </a>
        </div>
    </div>

    <!-- Stats Blocks -->
    <div class="stats-blocks">
        <div class="stat-block present">
            <h3>Present</h3>
            <p>{{ stats.present }}</p>
        </div>
        <div class="stat-block absent">
            <h3>Absent</h3>
            <p>{{ stats.absent }}</p>
        </div>
        <div class="stat-block working">
            <h3>Working Days</h3>
            <p>{{ stats.working_days }}</p>
        </div>
    </div>

    <!-- Today's Interval Records -->
    <div class="interval-records-container">
        <h3>📊 Today's Attendance by Interval</h3>
        <div class="interval-records" id="intervalRecords">
            <p>Loading interval records...</p>
        </div>
    </div>

    <!-- Calendar Container (Always Visible) -->
    <div class="calendar-container" id="calendarContainer">
        <h3>📅 Monthly Attendance Calendar</h3>
        <div class="calendar-header">
            <button id="prevMonth" type="button">◀ Previous</button>
            <span id="calendarMonth">January 2025</span>
            <button id="nextMonth" type="button">Next ▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='dashboard-intervals.js') }}"></script>
</body>
</html>
